<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1920"><title>Your code becomes a result.</title><link rel="stylesheet" href="./style.css"><script src="./node_modules/gsap/dist/gsap.min.js"></script></head>
<body><main id="root" data-composition-id="root" data-start="0" data-width="1920" data-height="1080" data-fps="30">
<div class="stage"><div class="grid"></div><div class="orb"></div><div class="content"><header class="header"><div class="eyebrow"><span>PY / 30</span> DAY 01 · THE FIRST PROGRAM</div><h1>Your code becomes a result.</h1><div class="rule"></div></header><div class="flow"><div class="flow-card reveal"><div class="symbol">{ }</div><h2>WRITE</h2><p>hello.py</p><code>print(10 + 20)</code></div><div class="connector reveal">→</div><div class="flow-card reveal"><div class="symbol">▶</div><h2>RUN</h2><p>Python interpreter</p><code>python hello.py</code></div><div class="connector reveal">→</div><div class="flow-card reveal"><div class="symbol">30</div><h2>SEE</h2><p>terminal output</p><code>30</code></div></div><div class="ribbon reveal">The editor stores the file; the interpreter executes it.</div></div><footer class="footer"><span>PYTHON FOUNDATIONS</span><span>01 / TECHNICAL NOTES</span></footer></div><div id="end-marker" hidden></div>
</main><script>
  const tl=gsap.timeline({paused:true});
  tl.fromTo('.stage',{opacity:0},{opacity:1,duration:.38,ease:'power2.inOut'},0);
  tl.fromTo('.content',{filter:'blur(10px)',opacity:.3},{filter:'blur(0px)',opacity:1,duration:.55,ease:'power2.inOut'},0);
  tl.fromTo('.content',{x:14,scale:1.012},{x:-8,scale:1,duration:3.5,ease:'sine.inOut'},0);
  tl.fromTo('.orb',{x:0,y:0},{x:-85,y:35,duration:3.5,ease:'sine.inOut'},0);
  tl.fromTo('.reveal',{opacity:0,y:22},{opacity:1,y:0,duration:.54,stagger:.15,ease:'power2.out'},.35);
  
  tl.to('.content',{filter:'blur(7px)',opacity:0,duration:.3,ease:'power2.inOut'},3.2);
  tl.to('.stage',{opacity:0,duration:.26,ease:'power2.inOut'},3.24);
  tl.set('#end-marker',{opacity:1},3.5);
  window.__timelines=window.__timelines||{};window.__timelines.root=tl;
</script></body></html>
