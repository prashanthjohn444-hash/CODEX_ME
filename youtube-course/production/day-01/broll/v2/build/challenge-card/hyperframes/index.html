<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1920, height=1080"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>:root{--g:#2E9E3A;--v:#7B3FD1;--c:#1D7FD6;--a:#FFBE55;--bg:#FAF6EE;--hd:#1B1F2A;--ink:#1B1F2A;--res:#0F3F63;--mut:#6B7280;--mut2:#8A8F98;--idx:#7A5FB0;--gr:46,158,58;--vr:123,63,209;--cr:29,127,214;--grid:rgba(0,0,0,.045);--pf:rgba(255,255,255,.75);--pfl:rgba(255,255,255,1);--ga:0.3;--sp:35%;--mono:ui-monospace,Menlo,Consolas,monospace;--head:'Bebas Neue','Noto Sans Telugu','Oswald','Arial Narrow',Impact,sans-serif;--body:'Barlow','Noto Sans Telugu','Segoe UI',system-ui,sans-serif}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#eee}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--body);padding:env(safe-area-inset-top,0) 8px env(safe-area-inset-bottom,0)}
.scale{width:100%;max-width:1100px;aspect-ratio:16/9;container-type:inline-size}
.scene{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;padding:3.2cqw 4cqw;display:flex;flex-direction:column;gap:1.5cqw}
.scene::before{content:'';position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:3cqw 3cqw}
.fade{opacity:0;transform:translateY(1cqw);transition:opacity .6s ease,transform .6s ease}
.on{opacity:1;transform:none}
.dim{opacity:.25!important}
h1{font-family:var(--head);font-weight:400;font-size:5.2cqw;color:var(--hd);letter-spacing:.02em;line-height:1;position:relative}
h1 small{font-family:var(--body);font-size:1.6cqw;color:var(--mut);margin-left:1.6cqw;letter-spacing:0}
.panel{position:relative;border:1px solid var(--k);border-radius:1.4cqw;padding:1.2cqw 2cqw;background:var(--pf);box-shadow:0 0 2cqw -0.6cqw color-mix(in srgb,var(--k) var(--sp),transparent);transition:opacity .6s,transform .6s,box-shadow .4s,background .4s}
.panel .t{font-family:var(--head);font-size:2.2cqw;color:var(--k);letter-spacing:.06em;margin-bottom:.5cqw}
.pin,.pbt{--k:var(--g);--kr:var(--gr)}.pmem{--k:var(--v);--kr:var(--vr)}.pout,.pbf{--k:var(--c);--kr:var(--cr)}
.pin,.pmem{flex:none}.pout{flex:1}
.row{display:flex;gap:1.5cqw;flex:none}.col{flex:1;display:flex;flex-direction:column;gap:1.5cqw}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:1.5cqw}
.code{font-family:var(--mono);font-size:2.1cqw;color:var(--ink);line-height:1.5}
.big{font-family:var(--mono);font-size:2.8cqw;color:var(--hd)}.big .v{color:var(--v);font-weight:600}
.ln{height:0;overflow:hidden;opacity:0;transition:opacity .4s,height .3s}.ln.on{height:3.2cqw;opacity:1}
.lit.panel{box-shadow:0 0 3cqw rgba(var(--kr),var(--ga));background:var(--pfl)}
.cells{display:flex;gap:1.4cqw;justify-content:center;align-items:flex-start;margin-top:.4cqw}
.cell{width:7.2cqw;text-align:center;opacity:0;transform:scale(.6);transition:all .45s cubic-bezier(.2,.9,.3,1.2)}
.cell.on{opacity:1;transform:none}
.cell .b{height:6cqw;border:1.5px solid rgba(var(--vr),.6);border-radius:1cqw;background:rgba(var(--vr),.08);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:3.6cqw;color:var(--hd);transition:all .4s}
.cell .i{font-family:var(--mono);font-size:1.7cqw;color:var(--idx);margin-top:.5cqw}
.cell.hot .b{background:rgba(var(--vr),.38);border-color:var(--v);box-shadow:0 0 2.2cqw rgba(var(--vr),var(--ga))}
.cell.hot .i{color:var(--hd)}
.nodes{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center;gap:.6cqw}
.node{border:1px solid rgba(var(--vr),.55);border-radius:1.1cqw;padding:1cqw .6cqw;text-align:center;transition:all .4s}
.node .nl{font-family:var(--head);font-size:1.9cqw;color:var(--v);letter-spacing:.06em}
.node .v{font-family:var(--mono);font-size:2cqw;color:var(--hd)}
.node.lit{background:rgba(var(--vr),.35);box-shadow:0 0 2.4cqw rgba(var(--vr),var(--ga));border-color:var(--v)}
.ar{color:var(--v);font-size:2.2cqw}
.back{grid-column:3/8;height:2.2cqw;border:2px dotted rgba(var(--vr),.7);border-top:0;border-radius:0 0 1cqw 1cqw;margin:0 4cqw}
.res{font-family:var(--mono);font-size:2.4cqw;color:var(--res);display:flex;gap:1.6cqw;align-items:baseline}
.res em{font-style:normal;color:var(--mut2);font-size:1.8cqw}
.res strong{color:var(--c);font-weight:600;text-shadow:0 0 1.4cqw rgba(var(--cr),var(--ga));font-size:3cqw}
h1{display:flex;align-items:center}
.logo{width:1.1em;height:1.1em;vertical-align:-.14em;flex:none}
.badges{margin-left:auto;display:inline-flex;gap:1.2cqw;align-items:center}.badges .logo{width:4.4cqw;height:4.4cqw}
.cell .b .logo{width:3.6cqw;height:3.6cqw}
.has-ver{position:relative}.big .has-ver{display:inline-block}
.ver.o{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0}.big .ver.o{justify-content:flex-start}
#bar{width:100%;max-width:1100px;display:flex;gap:10px;align-items:center;padding:10px 2px;font-size:14px}
#bar button,#bar select{background:#1d1f26;color:#eee;border:1px solid #3a3d48;border-radius:8px;padding:7px 12px;font-size:14px}
#scrub{flex:1}
body.cap #bar{display:none}

/* --- HyperFrames overrides: seek-based rendering, no CSS transitions; GSAP owns every change --- */
html,body{width:1920px;height:1080px;overflow:hidden;background:#FAF6EE;display:block;padding:0;margin:0}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#FAF6EE}
.clip{position:absolute;inset:0}.scale{max-width:none;width:1920px;height:1080px}
*,*::before{transition:none!important;animation:none!important}
.ln{height:3.2cqw}.cell .b,.node{box-shadow:0 0 0px 0px rgba(123,63,209,0)}
.panel.pin,.panel.pbt{box-shadow:0 0 38px -12px rgba(46,158,58,0.35)}.panel.pmem{box-shadow:0 0 38px -12px rgba(123,63,209,0.35)}.panel.pout,.panel.pbf{box-shadow:0 0 38px -12px rgba(29,127,214,0.35)}</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080" data-fps="30">
 <section id="scene-clip" class="clip" data-start="0" data-duration="4" data-track-index="0"><div class="scale"><div class="scene" id="scene"><h1 class="fade" id="h">DAY 1 CHALLENGE<small>Save and run your own greeting file</small></h1><div class="panel pin fade" id="pin" style=""><div class="t">YOUR FILE</div><div class="code ln" id="l0">print("Hello, Python!")</div><div class="code ln" id="l1">print(10 + 20)</div><div class="code ln" id="l2">print(type(30))</div></div><div class="fade" id="nodes"><div class="nodes" style="grid-template-columns:1fr auto 1fr auto 1fr auto 1fr"><div class="node" id="n0"><div class="nl">WRITE</div><div class="v" id="n0v">greeting.py</div></div><span class="ar">→</span><div class="node" id="n1"><div class="nl">SAVE</div><div class="v" id="n1v">Ctrl+S</div></div><span class="ar">→</span><div class="node" id="n2"><div class="nl">RUN</div><div class="v" id="n2v">in terminal</div></div><span class="ar">→</span><div class="node" id="n3"><div class="nl">CHANGE</div><div class="v" id="n3v">one line</div></div></div></div><div class="panel pout fade" id="pout" style=""><div class="t">YOU SHOULD SEE</div><div class="res ln" id="o0">Hello, Python!</div><div class="res ln" id="o1">30</div><div class="res ln" id="o2">&lt;class 'int'&gt;</div></div></div></div></section>
</div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.to("#h",{"opacity":1,"y":0,"duration":0.6,"ease":"power2.out"},0.12);
tl.to("#pin",{"opacity":1,"y":0,"duration":0.6,"ease":"power2.out"},0.3);
tl.to("#l0",{"opacity":1,"duration":0.4,"ease":"power2.out"},0.3);
tl.to("#l1",{"opacity":1,"duration":0.4,"ease":"power2.out"},0.45);
tl.to("#l2",{"opacity":1,"duration":0.4,"ease":"power2.out"},0.6);
tl.to("#nodes",{"opacity":1,"y":0,"duration":0.6,"ease":"power2.out"},0.8);
tl.to("#n0",{"backgroundColor":"rgba(123,63,209,0.16)","borderColor":"#7B3FD1","boxShadow":"0 0 46px 0px rgba(123,63,209,0.3)","duration":0.4,"ease":"power2.out"},1);
tl.to("#n0",{"backgroundColor":"rgba(123,63,209,0)","borderColor":"rgba(123,63,209,.55)","boxShadow":"0 0 0px 0px rgba(123,63,209,0)","duration":0.4,"ease":"power2.out"},1.5);
tl.to("#n1",{"backgroundColor":"rgba(123,63,209,0.16)","borderColor":"#7B3FD1","boxShadow":"0 0 46px 0px rgba(123,63,209,0.3)","duration":0.4,"ease":"power2.out"},1.5);
tl.to("#n1",{"backgroundColor":"rgba(123,63,209,0)","borderColor":"rgba(123,63,209,.55)","boxShadow":"0 0 0px 0px rgba(123,63,209,0)","duration":0.4,"ease":"power2.out"},2);
tl.to("#n2",{"backgroundColor":"rgba(123,63,209,0.16)","borderColor":"#7B3FD1","boxShadow":"0 0 46px 0px rgba(123,63,209,0.3)","duration":0.4,"ease":"power2.out"},2);
tl.to("#n2",{"backgroundColor":"rgba(123,63,209,0)","borderColor":"rgba(123,63,209,.55)","boxShadow":"0 0 0px 0px rgba(123,63,209,0)","duration":0.4,"ease":"power2.out"},2.5);
tl.to("#n3",{"backgroundColor":"rgba(123,63,209,0.16)","borderColor":"#7B3FD1","boxShadow":"0 0 46px 0px rgba(123,63,209,0.3)","duration":0.4,"ease":"power2.out"},2.5);
tl.to("#n3",{"backgroundColor":"rgba(123,63,209,0)","borderColor":"rgba(123,63,209,.55)","boxShadow":"0 0 0px 0px rgba(123,63,209,0)","duration":0.4,"ease":"power2.out"},2.9);
tl.to("#pout",{"opacity":1,"y":0,"duration":0.6,"ease":"power2.out"},2.95);
tl.to("#o0",{"opacity":1,"duration":0.4,"ease":"power2.out"},2.95);
tl.to("#o1",{"opacity":1,"duration":0.4,"ease":"power2.out"},3.2);
tl.to("#o2",{"opacity":1,"duration":0.4,"ease":"power2.out"},3.4);
tl.to({},{duration:.01},3.99); /* pins the timeline length to the composition */
window.__timelines.main=tl;
</script></body></html>
